name: Publish
on:
  release:
    types: [published]
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@92467eb28f72e8255933372f1e0707c567ce2259 # v4.0.0
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          NPM_TOKEN: op://EcAuth/npmjs-credentials/credential
          CLOUDFLARE_API_TOKEN: op://EcAuth/cloudflare-credentials/CLOUDFLARE_API_TOKEN
          CLOUDFLARE_ACCOUNT_ID: op://EcAuth/cloudflare-credentials/CLOUDFLARE_ACCOUNT_ID
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test

      - name: Validate release tag matches package version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${{ github.event.release.tag_name }}"
          if [ "$TAG" != "v${VERSION}" ]; then
            echo "::error::Release tag ($TAG) does not match package.json version (v${VERSION})"
            exit 1
          fi

      - name: Publish to npm (skip if already published)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if npm view "${NAME}@${VERSION}" version 2>/dev/null; then
            echo "::notice::${NAME}@${VERSION} is already published, skipping"
          else
            pnpm publish --provenance --access public --no-git-checks
          fi
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Upload build artifacts to release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release upload "v${VERSION}" dist/ecauth-auth.umd.js dist/ecauth-auth.esm.js --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Prepare CDN files
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p cdn-dist/auth-js/${VERSION}
          mkdir -p cdn-dist/auth-js/latest
          cp dist/ecauth-auth.umd.js cdn-dist/auth-js/${VERSION}/
          cp dist/ecauth-auth.esm.js cdn-dist/auth-js/${VERSION}/
          cp dist/ecauth-auth.umd.js cdn-dist/auth-js/latest/
          cp dist/ecauth-auth.esm.js cdn-dist/auth-js/latest/

      - name: Download past versions from GitHub Releases
        run: |
          for tag in $(gh release list --limit 100 --json tagName -q '.[].tagName'); do
            version="${tag#v}"
            if [ -d "cdn-dist/auth-js/${version}" ]; then continue; fi
            mkdir -p "cdn-dist/auth-js/${version}"
            gh release download "$tag" --pattern "*.umd.js" --dir "cdn-dist/auth-js/${version}" || true
            gh release download "$tag" --pattern "*.esm.js" --dir "cdn-dist/auth-js/${version}" || true
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cdn-dist --project-name=ecauth-cdn --branch=main
